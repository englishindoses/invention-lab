<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartoon Lab — Artwork Preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #153747; background: #dbf5ef; font-family: 'Trebuchet MS', Arial, sans-serif; }
    header { padding: 18px 5%; background: #fff8df; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    h1 { font-size: 22px; margin: 0 0 5px; }
    p { margin: 0; font-size: 13px; }
    a { color: #075b80; }
    .scene { min-height: calc(100vh - 90px); display: grid; place-items: center; background: url('assets/images/cartoon/workshop-background.png') center / cover; padding: 35px 10%; }
    .machine { width: min(920px, 80vw); position: relative; }
    .machine img { display: block; width: 100%; height: auto; }
    .word { position: absolute; top: 37%; height: 24%; width: 27%; display: grid; place-items: center; text-align: center; font-weight: bold; font-size: clamp(15px, 3.1vw, 46px); color: #16485a; }
    .left { left: 18%; } .right { left: 54%; }
    @media (max-width: 650px) { header { flex-direction: column; align-items: flex-start; } .scene { padding: 20px 2%; } .machine { width: 96vw; } }
  </style>
</head>
<body>
  <header><div><h1>Cartoon Lab · Artwork Preview</h1><p>Machine and workshop together. Sample words show readability; this page is not the playable game.</p></div><a href="index.html">Back to the game →</a></header>
  <main class="scene"><div class="machine"><img src="assets/images/cartoon/machine-body.png" alt="Bright turquoise and yellow invention machine with coral gears and bubbling green power tubes"><span class="word left">backpack</span><span class="word right">flies</span></div></main>
</body>
</html>
